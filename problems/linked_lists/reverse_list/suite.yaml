problem:
  name: "Reverse a Linked List"
  topic: "Linked Lists"
  difficulty: "intermediate"
  description: >
    Reverse a singly linked list and print the nodes in order.
    
    Input format:
      Line 1: n (number of nodes)
      Line 2: n space-separated integers (node values)
    
    Output format:
      Space-separated values of the reversed list
    
    Example:
      Input:  5\n1 2 3 4 5
      Output: 5 4 3 2 1
  languages: [python, c, cpp, java]
  time_limit: 5

scoring:
  total_points: 4

hints:
  general: "Try using three pointers: prev, current, and next. Walk through the list, reversing each link as you go."
