[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gradbot"
dynamic = ["version"]
description = "Autograder for programming courses on a free GitHub organization. Hidden checks never reach the student."
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Aditya Khandelwal" }]
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0.1,<7"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Education",
    "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
# Exact pins so CI and every contributor run the same tools.
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "coverage==7.17.0; python_version >= '3.11'",
    "coverage==7.16.2; python_version < '3.11'",  # 7.17 dropped Python 3.10
    "ruff==0.17.3",
    "mypy==2.4.1",
    "types-PyYAML==6.0.12.20261030",
]

[project.scripts]
grade = "gradbot.cli:main"
GradBot = "gradbot.cli:main"

[project.urls]
Homepage = "https://github.com/nvmaditya/gradbot"
Issues = "https://github.com/nvmaditya/gradbot/issues"

[tool.setuptools]
packages = ["gradbot"]

[tool.setuptools.dynamic]
version = { attr = "gradbot.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "live: talks to real GitHub; skipped unless GRADBOT_LIVE=1 or the needed token is set",
    "docker: needs a working Docker daemon",
    "java: needs a working JDK (javac and java)",
    "e2e: drives the installed `grade` command as a subprocess",
]

[tool.coverage.run]
source = ["gradbot"]
branch = true
# Also measure the `grade` subprocesses the end-to-end tests start.
patch = ["subprocess"]
parallel = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Workflow YAML templates keep their run lines on one line.
"gradbot/policy.py" = ["E501"]
"gradbot/grade_workflow.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["gradbot"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
